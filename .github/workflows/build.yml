name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # attach the exe to releases
  id-token: write         # sign the build attestation
  attestations: write     # store the build attestation
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CMDPlus.exe
        shell: cmd
        run: call build.cmd

      # A signed record that this exact CMDPlus.exe was built here from this commit. Anyone can check a download
      # against it with: gh attestation verify CMDPlus.exe --repo andmca/cmd-plus
      - name: Attest CMDPlus.exe
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: CMDPlus.exe

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CMDPlus
          path: CMDPlus.exe

      # Publishing a release on GitHub, or pushing a tag such as v1.0.0, attaches CMDPlus.exe to that release.
      - name: Attach CMDPlus.exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}   # passed as a variable, never pasted into the script, so a tag name can't add commands
        run: |
          $tag = $env:TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag CMDPlus.exe --clobber
          } else {
            gh release create $tag CMDPlus.exe --title "CMD+ $tag" --generate-notes
          }
          exit $LASTEXITCODE
