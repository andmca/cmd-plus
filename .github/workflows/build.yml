name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CMDPlus.exe
        shell: cmd
        run: call build.cmd

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CMDPlus
          path: CMDPlus.exe

      # Publishing a release on GitHub, or pushing a tag such as v1.0.0, attaches CMDPlus.exe to that release.
      - name: Attach CMDPlus.exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag CMDPlus.exe --clobber
          } else {
            gh release create $tag CMDPlus.exe --title "CMD+ $tag" --generate-notes
          }
          exit $LASTEXITCODE
